name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Frontend — lint + build (Vite + React JSX)
  # ------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Auditar dependencias (falla en severidad alta/crítica)
        run: npm audit --audit-level=high
        continue-on-error: true # advertencia, no bloqueante hasta tener control de deps

      - name: Build de producción (Vite)
        run: npm run build
        env:
          # Valores dummy para que Vite no falle por env vars faltantes en CI
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_TEST || 'placeholder-key' }}

  # ------------------------------------------------------------------
  # 2. Backend — imports, ruff lint, pytest (Python / FastAPI)
  # ------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar importaciones (smoke test)
        run: |
          python -c "
          from app.data import db, store
          from app.auth.dependencies import create_access_token, require_role
          from app.routers import auth, booking, admin_transactions, admin_users, payments
          from app.payments.mock_provider import MockPaymentProvider
          from app.services.booking_service import create_appointment
          print('Imports OK')
          "
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_KEY: ""
          JWT_SECRET: "ci-test-secret"

      - name: Ruff lint
        run: |
          pip install ruff --quiet
          ruff check app/
        continue-on-error: true # advertencia hasta que tengamos configuración base de ruff

      - name: Pytest (si hay tests)
        run: |
          if [ -d "tests" ] && find tests -name "test_*.py" | grep -q .; then
            pip install pytest
            pytest tests/ -v
          else
            echo "Sin tests aún — job omitido"
          fi
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_KEY: ""
          JWT_SECRET: "ci-test-secret"
